name: SonarCloud Code Quality

on:
  push:
    branches:
      - main
      - develop
      - master
      - master1
  pull_request:
    branches:
      - main
      - develop
      - master
      - master1
  schedule:
    - cron: '0 3 * * 0'  # Weekly scan on Monday at 3 AM UTC

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'zulu'
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Install SonarCloud scanner
      run: dotnet tool install --global dotnet-sonarscanner
    
    - name: Install code coverage tools
      run: dotnet tool install --global coverlet.console
    
    - name: Restore dependencies
      run: dotnet restore LearnLink/LearnLink.csproj
    
    - name: Begin SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"LearnLink" \
          /o:"learnlink-org" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.coverage.reportsPaths="**/coverage.opencover.xml" \
          /d:sonar.sources="LearnLink" \
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/*.Designer.cs,**/Migrations/**"
    
    - name: Build project
      run: dotnet build LearnLink/LearnLink.csproj --configuration Release --no-restore
    
    - name: Run tests with coverage
      run: |
        dotnet test LearnLink/LearnLink.csproj \
          --configuration Release \
          --no-build \
          --collect:"XPlat Code Coverage" \
          --results-directory:"./coverage" \
          /p:CoverletOutputFormat=opencover \
          /p:CoverletOutput="./coverage/" \
          --logger trx \
          --logger "console;verbosity=normal" \
          || echo "No tests found - skipping coverage collection"
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: ./coverage/
        retention-days: 30
    
    - name: End SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sonarcloud-report
        path: .sonarqube/
        retention-days: 30
