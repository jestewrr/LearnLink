# SonarCloud Project Configuration for LearnLink

# Project identification
sonar.projectKey=LearnLink
sonar.projectName=LearnLink
sonar.projectVersion=1.0
sonar.projectDescription=Secure educational resource management platform with multi-tenancy support

# Source code location
sonar.sources=LearnLink
sonar.sourceEncoding=UTF-8

# Excluded files and directories (build artifacts, migrations, etc.)
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/*.Designer.cs,**/Migrations/**,.git/**,*.json.lock

# C# specific settings
sonar.cs.coverage.reportsPaths=**/coverage.opencover.xml
sonar.cs.roslyn.ignoreIssues=false

# Security analysis rules
sonar.security.hotspots.reviewed=0
sonar.securityHotspots.rating.max=5

# Code analysis level
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Performance settings
sonar.java.source=11
sonar.java.binaries=.
sonar.java.libraries=.

# Duplications and coverage
sonar.cpd.exclusions=**/Migrations/**,**/*.Designer.cs
sonar.coverage.exclusions=**/Migrations/**,**/*.Designer.cs,**/Program.cs

# Issue tracking
sonar.analysis.detectedci=true
sonar.analysis.detectedciurl=https://github.com/yourusername/LearnLink

# Silent analysis (no logs in output)
sonar.verbose=false
sonar.log.level=INFO
